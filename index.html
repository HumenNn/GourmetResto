<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GourmetResto</title>
    <link rel="stylesheet" href="style.css">

    <!-- Подключение шрифтов -->
    <link href="https://fonts.googleapis.com/css2?family=Inspiration&family=Jeju+Myeongjo&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">GourmetResto</div>

            <nav class="nav">
                <a href="#">Main</a>
                <a href="#">Menu</a>
                <a href="#">About us</a>
                <a href="#">Contacts</a>
            </nav>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <h1>Вкус, который вдохновляет</h1>
            <p>Авторская кухня и атмосфера уюта в центре города</p>
            <button class="btn">Смотреть меню</button>
        </div>
    </section>

    <!-- DISH OF THE DAY -->
    <section class="dish">
        <div class="container dish-content">
            <div class="dish-image"></div>

            <div class="dish-text">
                <h2>Блюдо дня</h2>
                <p>Текст про самое вкусное блюдо в мире</p>
            </div>
        </div>
    </section>
<script src="script.js"></script>
</body>
</html>
