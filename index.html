<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo">GourmetResto</div>

                <a href="contacts.html">Contacts</a>

    <section class="hero">
        <div class="container">
