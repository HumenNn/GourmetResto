<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - Testimonials Slider</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .testimonials__slider {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
      }
      .testimonials__slide {
        display: none;
        padding: 20px;
        background: #f0f0f0;
        border-radius: 8px;
      }
      .testimonials__slide--active {
        display: block;
      }
      .testimonials__nav {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
      .testimonials__nav-btn {
        padding: 10px 20px;
        border: 1px solid #ccc;
        background: white;
        cursor: pointer;
      }
      .testimonials__dots {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }
      .testimonials__dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ccc;
        margin: 0 5px;
        cursor: pointer;
      }
      .testimonials__dot--active {
        background: #007bff;
      }
    </style>
  </head>
  <body>
    <h1>Testimonials Slider Test</h1>

    <div class="testimonials__slider">
      <div class="testimonials__slide testimonials__slide--active">
        <p>"Отличный ресторан! Очень вкусно!"</p>
        <cite>- Иван Иванов</cite>
      </div>
      <div class="testimonials__slide">
        <p>"Прекрасное обслуживание и атмосфера."</p>
        <cite>- Мария Петрова</cite>
      </div>
      <div class="testimonials__slide">
        <p>"Рекомендую всем! Лучший в городе."</p>
        <cite>- Алексей Сидоров</cite>
      </div>

      <div class="testimonials__nav">
        <button class="testimonials__nav-btn testimonials__nav-btn--prev">Назад</button>
        <button class="testimonials__nav-btn testimonials__nav-btn--next">Вперед</button>
      </div>

      <div class="testimonials__dots">
        <div class="testimonials__dot testimonials__dot--active" data-slide="0"></div>
        <div class="testimonials__dot" data-slide="1"></div>
        <div class="testimonials__dot" data-slide="2"></div>
      </div>
    </div>

    <script>
      function initializeTestimonialsSlider() {
        console.log('Initializing testimonials slider...');
        const testimonialsSlider = document.querySelector('.testimonials__slider');

        if (testimonialsSlider) {
          console.log('Testimonials slider found, setting up...');
          const slides = document.querySelectorAll('.testimonials__slide');
          const dots = document.querySelectorAll('.testimonials__dot');
          const prevBtn = document.querySelector('.testimonials__nav-btn--prev');
          const nextBtn = document.querySelector('.testimonials__nav-btn--next');

          let currentSlide = 0;
          const totalSlides = slides.length;

          function showSlide(index) {
            console.log('Showing slide:', index);
            slides.forEach((slide) => slide.classList.remove('testimonials__slide--active'));
            dots.forEach((dot) => dot.classList.remove('testimonials__dot--active'));
            slides[index].classList.add('testimonials__slide--active');
            dots[index].classList.add('testimonials__dot--active');
            currentSlide = index;
          }

          function nextSlide() {
            showSlide((currentSlide + 1) % totalSlides);
          }

          function prevSlide() {
            showSlide((currentSlide - 1 + totalSlides) % totalSlides);
          }

          if (nextBtn) nextBtn.addEventListener('click', nextSlide);
          if (prevBtn) prevBtn.addEventListener('click', prevSlide);

          dots.forEach((dot, index) => {
            dot.addEventListener('click', () => showSlide(index));
          });

          // Автоматическое переключение
          let autoSlideInterval = setInterval(nextSlide, 3000);

          testimonialsSlider.addEventListener('mouseenter', () => {
            clearInterval(autoSlideInterval);
            console.log('Auto slide paused');
          });
          testimonialsSlider.addEventListener('mouseleave', () => {
            autoSlideInterval = setInterval(nextSlide, 3000);
            console.log('Auto slide resumed');
          });

          console.log('Testimonials slider initialized successfully');
        } else {
          console.error('Testimonials slider not found!');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        console.log('Test page loaded');
        initializeTestimonialsSlider();
      });
    </script>
  </body>
</html>
